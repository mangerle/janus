<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Janus 现代几何双门徽标：对称双弧箭翼象征双系统切换，中央圆角菱形门轴代表 UEFI 固件层 -->
  <rect x="16" y="16" width="224" height="224" rx="58" fill="#111827"/>
  <rect x="17.5" y="17.5" width="221" height="221" rx="56.5" fill="none" stroke="#7C8CFF" stroke-opacity="0.28" stroke-width="3"/>

  <!-- 左侧门翼（品牌靛蓝） -->
  <path d="M 77.1 184.5
           A 76 76 0 0 1 104.5 55.7
           L 100.2 48.0
           Q 98.6 45.2 101.6 46.8
           L 139.2 66.8
           Q 142.2 68.3 139.5 70.4
           L 117.2 92.6
           Q 114.8 94.8 115.4 91.6
           L 113.8 84.2
           A 46 46 0 0 0 97.2 162.2
           A 15 15 0 0 1 77.1 184.5 Z"
        fill="#5468FF"/>

  <!-- 右侧门翼（现代活力橙，中心对称 180 度） -->
  <path d="M 178.9 71.5
           A 76 76 0 0 1 151.5 200.3
           L 155.8 208.0
           Q 157.4 210.8 154.4 209.2
           L 116.8 189.2
           Q 113.8 187.7 116.5 185.6
           L 138.8 163.4
           Q 141.2 161.2 140.6 164.4
           L 142.2 171.8
           A 46 46 0 0 0 158.8 93.8
           A 15 15 0 0 1 178.9 71.5 Z"
        fill="#F97316"/>

  <!-- 中央 UEFI 固件门轴核心（圆角菱形） -->
  <path d="M 131 107 L 149 125 Q 152 128 149 131 L 131 149 Q 128 152 125 149 L 107 131 Q 104 128 107 125 L 125 107 Q 128 104 131 107 Z"
        fill="#F8FAFC"/>
  <circle cx="128" cy="128" r="8" fill="#111827"/>
</svg>
