# git-cliff 变更日志配置：发布工作流用 --latest 生成当前标签的分类说明。
# 官方参考文档: https://git-cliff.org/docs/configuration

[changelog]
header = """
# 更新日志 (Changelog)

本项目所有显著的版本变更均记录于此文档中。
格式遵循 [Keep a Changelog](https://keepachangelog.com/zh-CN/1.0.0/) 规范。
\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [未发布]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
sort_commits = "newest"

commit_preprocessors = [
  { pattern = '\((\w+\s)?#[0-9]+\)', replace = "" },
]

commit_parsers = [
  { message = "^feat", group = "新功能" },
  { message = "^fix", group = "问题修复" },
  { message = "^perf", group = "性能" },
  { message = "^refactor", group = "重构" },
  { message = "^doc", group = "文档" },
  { message = "^test", group = "测试" },
  { message = "^style", group = "格式" },
  { message = "^ci", group = "流水线" },
  { message = "^chore\\(release\\): prepare for", skip = true },
  { message = "^chore", group = "杂项" },
  { default = "杂项" },
]

protect_breaking_commits = false
tag_pattern = "v[0-9]*"
